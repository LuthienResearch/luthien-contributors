# Paste this at https://api.slack.com/apps -> Create New App -> From a manifest,
# choosing the Seattle AI Safety workspace.
display_information:
  name: Luthien Agent
  description: Luthien's team agent (Claude Agent SDK)
features:
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: luthien-agent
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - im:history
      - im:read
      - chat:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
